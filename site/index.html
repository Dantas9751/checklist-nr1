<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Check-One</title>
  <meta name="description" content="Check-One: autodiagnóstico de conformidade com a NR-1 (GRO/PGR e riscos psicossociais) por porte da empresa, com score e relatório.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1b73'/%3E%3Cpath d='M16 5c1 6 4 10 11 11-7 1-10 5-11 11-1-6-4-10-11-11 7-1 10-5 11-11z' fill='%23ffffff'/%3E%3Ccircle cx='24' cy='8' r='2.4' fill='%23f07a1a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>

  <header class="barra">
    <div class="barra__linha">
      <button type="button" class="barra__marca" data-acao="inicio" aria-label="Check-One, página inicial">
        <svg class="barra__estrela" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.8 4.8 3.2 7.6 10 10-6.8 2.4-9.2 5.2-10 10-.8-4.8-3.2-7.6-10-10 6.8-2.4 9.2-5.2 10-10z"/></svg>
        <span>Check-One</span>
      </button>
      <p class="barra__contexto" id="barra-contexto"></p>
      <nav class="barra__nav" aria-label="Principal">
        <a class="barra__link" href="#contexto-legal" data-acao="contexto">Contexto legal</a>
        <button type="button" class="barra__link barra__link--menu" popovertarget="menu-ferramentas">
          Ferramentas
          <svg class="barra__seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
        </button>
      </nav>
      <button type="button" class="barra__link barra__link--menu barra__menu-celular" popovertarget="menu-principal">Menu</button>
      <button type="button" class="botao-icone" id="botao-tema" popovertarget="menu-tema" aria-label="Tema: automático" title="Tema: automático">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="progresso" role="progressbar" aria-label="Progresso do checklist" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
      <div class="progresso__barra"></div>
    </div>
    <div class="menu-flutuante" id="menu-ferramentas" popover></div>
    <div class="menu-flutuante" id="menu-principal" popover></div>
    <div class="menu-flutuante" id="menu-tema" popover></div>
  </header>

  <dialog class="dialogo" id="dialogo-confirmacao" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
    <form method="dialog" class="dialogo__corpo">
      <h2 id="dialogo-titulo"></h2>
      <p id="dialogo-texto"></p>
      <div class="dialogo__acoes">
        <button type="submit" class="botao botao--secundario" value="cancelar" autofocus>Cancelar</button>
        <button type="submit" class="botao botao--perigo" value="confirmar" id="dialogo-confirmar"></button>
      </div>
    </form>
  </dialog>

  <main id="conteudo" tabindex="-1">
    <section class="etapa" id="etapa-boas-vindas" data-etapa="boas-vindas" aria-labelledby="titulo-boas-vindas" hidden></section>
    <section class="etapa" id="etapa-como-marcar" data-etapa="como-marcar" aria-labelledby="titulo-como-marcar" hidden></section>
    <section class="etapa" id="etapa-porte" data-etapa="porte" aria-labelledby="titulo-porte" hidden></section>
    <section class="etapa" id="etapa-perguntas" data-etapa="perguntas" aria-label="Perguntas" hidden></section>
    <section class="etapa" id="etapa-revisao" data-etapa="revisao" aria-labelledby="titulo-revisao" hidden></section>
    <section class="etapa" id="etapa-relatorio" data-etapa="relatorio" aria-labelledby="titulo-relatorio" hidden></section>
    <section class="etapa" id="etapa-contexto" data-etapa="contexto" aria-labelledby="titulo-contexto" hidden></section>
    <section class="etapa" id="etapa-copsoq" data-etapa="copsoq" aria-labelledby="titulo-copsoq" hidden></section>
    <noscript><p class="aviso-js">Este checklist precisa de JavaScript ativado para funcionar.</p></noscript>
  </main>

  <p class="anuncio" id="anuncio" aria-live="polite"></p>
</body>
</html>
